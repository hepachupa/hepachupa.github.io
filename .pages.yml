media:
  input: public/images
  output: /images

content:
  - name: profile
    label: 프로필
    type: file
    path: src/data/profile.json
    fields:
      - { name: name, label: 이름, type: string, required: true }
      - { name: name_en, label: 영문 이름, type: string }
      - { name: role, label: 직무 (작은 주황 글씨), type: string }
      - { name: headline, label: 한 줄 소개 (큰 제목), type: string }
      - { name: intro, label: 소개 문단, type: text }
      - { name: email, label: 이메일, type: string }
      - { name: github, label: GitHub 주소, type: string }
      - { name: blog, label: 블로그 주소 (선택), type: string }
      - { name: resume, label: 이력서 PDF (선택), type: file }
      - { name: hero_video, label: 대표 영상 (유튜브 링크 또는 mp4), type: string }
      - { name: skills, label: 기술 스택, type: string, list: true }
      - { name: seo_description, label: 링크 미리보기 설명, type: text }
      - { name: og_image, label: 링크 미리보기 이미지 (1200x630), type: image }
      - { name: umami_website_id, label: Umami 방문 분석 ID (선택), type: string }

  - name: projects
    label: 프로젝트
    type: collection
    path: src/content/projects
    view:
      fields: [title, start, featured]
      primary: title
      sort: [start, title]
      default: { sort: start, order: desc }
    fields:
      - { name: title, label: 제목, type: string, required: true }
      - { name: summary, label: 한 줄 요약, type: text }
      - { name: start, label: 시작일, type: date, required: true }
      - { name: end, label: 종료일 (비우면 단일 날짜), type: date }
      - { name: ongoing, label: 진행 중, type: boolean }
      - { name: featured, label: 대표 프로젝트로 크게 노출, type: boolean }
      - { name: hidden, label: 숨기기, type: boolean }
      - { name: role, label: 내 역할, type: string }
      - { name: team, label: 팀 구성, type: string }
      - { name: contribution, label: 기여도, type: string }
      - { name: tags, label: 태그 / 기술, type: string, list: true }
      - { name: thumbnail, label: 썸네일 (16:9 권장), type: image }
      - { name: video, label: 영상 (유튜브 링크 또는 mp4 경로), type: string }
      - { name: highlights, label: 핵심 성과 (한 줄씩), type: string, list: true }
      - name: links
        label: 링크
        type: object
        list: true
        fields:
          - { name: label, label: 버튼 이름, type: string }
          - { name: url, label: 주소, type: string }
      - name: gallery
        label: 스크린샷
        type: image
        options: { multiple: { max: 12 } }
      - { name: body, label: 상세 설명, type: rich-text }

  - name: awards
    label: 수상
    type: collection
    path: src/content/awards
    view:
      fields: [title, start, result]
      primary: title
      sort: [start, title]
      default: { sort: start, order: desc }
    fields:
      - { name: title, label: 수상명, type: string, required: true }
      - { name: summary, label: 한 줄 요약, type: text }
      - { name: start, label: 수상일, type: date, required: true }
      - { name: organizer, label: 주최/주관, type: string }
      - { name: result, label: 결과, type: string }
      - { name: related, label: 관련 프로젝트 파일명 (예 killa), type: string }
      - { name: tags, label: 태그, type: string, list: true }
      - { name: thumbnail, label: 썸네일, type: image }
      - { name: certificate, label: 상장/증빙 이미지, type: image }
      - { name: hidden, label: 숨기기, type: boolean }
      - name: links
        label: 링크
        type: object
        list: true
        fields:
          - { name: label, label: 버튼 이름, type: string }
          - { name: url, label: 주소, type: string }
      - { name: body, label: 상세 설명, type: rich-text }

  - name: activities
    label: 대외활동
    type: collection
    path: src/content/activities
    view:
      fields: [title, start, organization]
      primary: title
      sort: [start, title]
      default: { sort: start, order: desc }
    fields:
      - { name: title, label: 활동명, type: string, required: true }
      - { name: summary, label: 한 줄 요약, type: text }
      - { name: start, label: 시작일, type: date, required: true }
      - { name: end, label: 종료일, type: date }
      - { name: ongoing, label: 진행 중, type: boolean }
      - { name: organization, label: 기관/단체, type: string }
      - { name: role, label: 역할, type: string }
      - { name: related, label: 관련 프로젝트 파일명 (예 killa), type: string }
      - { name: tags, label: 태그, type: string, list: true }
      - { name: thumbnail, label: 썸네일, type: image }
      - { name: highlights, label: 주요 성과 (한 줄씩), type: string, list: true }
      - { name: hidden, label: 숨기기, type: boolean }
      - name: links
        label: 링크
        type: object
        list: true
        fields:
          - { name: label, label: 버튼 이름, type: string }
          - { name: url, label: 주소, type: string }
      - { name: body, label: 상세 설명, type: rich-text }
